name: Mobile visual audit
on:
  push:
    branches: ['codex/mobile-visual-audit']
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --config=audits/playwright.config.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-visual-audit
          path: audit-results/
          retention-days: 14
